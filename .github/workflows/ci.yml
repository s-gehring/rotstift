name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename'); then
            echo build=true >> "$GITHUB_OUTPUT"
          elif grep -qE '^(src-tauri/|scripts/|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|index\.html$|\.nvmrc$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries/.download
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/runtime/manifest.ts') }}
      - run: pnpm fetch:runtime
      - run: pnpm check
      - run: pnpm exec vite build
      - name: Download the llama.cpp test model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSfL -o "$RUNNER_TEMP/models/stories260K-f32.gguf" \
            https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  $RUNNER_TEMP/models/stories260K-f32.gguf" | sha256sum -c -
      - name: Integration test with the real sidecar
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib starts_the_real -- --ignored
        env:
          ROTSTIFT_TEST_MODELS_DIR: ${{ runner.temp }}/models
          ROTSTIFT_TEST_MODEL: stories260K-f32.gguf

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries/.download
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/runtime/manifest.ts') }}
      - run: pnpm fetch:runtime
      - run: pnpm build --debug
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/binaries/llama
      - name: Smoke-test the sidecar in the build layout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            contents="$GITHUB_WORKSPACE/src-tauri/target/debug/bundle/macos/Rotstift.app/Contents"
            export ROTSTIFT_BUNDLE_EXE_DIR="$contents/MacOS" ROTSTIFT_BUNDLE_RESOURCE_DIR="$contents/Resources"
          else
            export ROTSTIFT_BUNDLE_EXE_DIR="$GITHUB_WORKSPACE/src-tauri/target/debug"
            export ROTSTIFT_BUNDLE_RESOURCE_DIR="$GITHUB_WORKSPACE/src-tauri/target/debug"
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib smoke_
