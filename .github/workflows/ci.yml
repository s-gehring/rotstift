name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries/.download
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/runtime/manifest.ts') }}
      - run: pnpm fetch:runtime
      - run: pnpm check
      - name: Download the llama.cpp test model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSfL -o "$RUNNER_TEMP/models/stories260K-f32.gguf" \
            https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  $RUNNER_TEMP/models/stories260K-f32.gguf" | sha256sum -c -
      - name: Integration test with the real sidecar
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib starts_the_real -- --ignored
        env:
          ROTSTIFT_TEST_MODELS_DIR: ${{ runner.temp }}/models
          ROTSTIFT_TEST_MODEL: stories260K-f32.gguf

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries/.download
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/runtime/manifest.ts') }}
      - run: pnpm fetch:runtime
      - run: pnpm build --debug
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/binaries/llama
      - name: Smoke-test the sidecar in the build layout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            contents="$GITHUB_WORKSPACE/src-tauri/target/debug/bundle/macos/Rotstift.app/Contents"
            export ROTSTIFT_BUNDLE_EXE_DIR="$contents/MacOS" ROTSTIFT_BUNDLE_RESOURCE_DIR="$contents/Resources"
          else
            export ROTSTIFT_BUNDLE_EXE_DIR="$GITHUB_WORKSPACE/src-tauri/target/debug"
            export ROTSTIFT_BUNDLE_RESOURCE_DIR="$GITHUB_WORKSPACE/src-tauri/target/debug"
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib smoke_
