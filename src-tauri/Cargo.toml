[package]
name = "rotstift"
version = "0.2.0"
description = "Lokale KI-Korrektur von Schülerarbeiten"
authors = ["Simon Gehring"]
license = "GPL-3.0-or-later"
repository = "https://github.com/s-gehring/rotstift"
edition = "2024"

[lib]
# Must differ from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "rotstift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
keyring = "4"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
