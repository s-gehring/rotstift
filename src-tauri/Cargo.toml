[package]
name = "rotstift"
version = "0.1.0"
description = "Lokale KI-Korrektur von Schülerarbeiten"
authors = ["Simon Gehring"]
license = "GPL-3.0-or-later"
repository = "https://github.com/s-gehring/rotstift"
edition = "2024"

[lib]
# Must differ from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "rotstift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
